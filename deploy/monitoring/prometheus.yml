# Prometheus on the AEGIS Lightsail server (listens on 127.0.0.1 only; Grafana is the public view at /grafana)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/aegis-alerts.yml

scrape_configs:
  - job_name: aegis            # FastAPI backend: HTTP, DeepSeek, agents, mission state
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: node             # the server itself: CPU, memory, disk
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
