# Alert rules, shown on the Grafana dashboard ("Firing alerts") and in Prometheus
groups:
  - name: aegis
    rules:
      - alert: AegisBackendDown
        expr: up{job="aegis"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "The AEGIS backend is not answering /metrics"}

      - alert: DeepSeekFailing
        expr: |
          sum(increase(aegis_llm_calls_total{outcome!="ok"}[10m])) / clamp_min(sum(increase(aegis_llm_calls_total[10m])), 1) > 0.5
          and sum(increase(aegis_llm_calls_total[10m])) >= 3
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than half of DeepSeek calls failed in the last 10 minutes (agents are answering from the rules)"}

      - alert: DeepSeekBusy
        expr: sum(increase(aegis_llm_calls_total{outcome=~"busy|timeout"}[10m])) >= 3
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "DeepSeek is timing out or refusing calls as too busy"}

      - alert: DeepSeekSlow
        expr: histogram_quantile(0.9, sum(rate(aegis_llm_latency_seconds_bucket[10m])) by (le)) > 15
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "90% of DeepSeek calls take longer than 15 s"}

      - alert: AgentAnalysisStalled
        expr: time() - aegis_analysis_last_run_timestamp_seconds > 300
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "The agents have not analysed the crew for more than 5 minutes"}

      - alert: BackendErrors
        expr: sum(rate(aegis_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "The backend is returning server errors"}

      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Less than 10% memory available on the server"}

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Less than 10% disk space left on the server"}
